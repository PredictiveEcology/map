## Thin caller -- the runner, dependency resolution, site build and gh-pages
## deploy all live in PredictiveEcology/actions.
##
## Pinned @main deliberately: tags freeze and rot (v0.1/v0.2 kept the ubuntugis
## PPA for months after the workflows rejected it).
##
## The bespoke file this replaces was the stock r-lib/actions example, with no
## customisation beyond `any::pkgdown` and `local::.` -- both of which the
## reusable workflow already supplies, so there is nothing to carry over.

name: pkgdown

on:
  push:
    ## Was [main, master]. `git ls-remote --heads` shows only `main` and
    ## `development`, so `master` was dead; `development` added to match the
    ## rest of the org.
    branches: [main, development]
  pull_request:
    branches: [main, development]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pkgdown:
    uses: PredictiveEcology/actions/.github/workflows/pkgdown.yaml@main
