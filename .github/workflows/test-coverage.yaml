## Thin caller -- runner, geospatial system dependencies, dependency resolution,
## caching and covr itself all live in PredictiveEcology/actions.
##
## Pinned @main deliberately: the bespoke file this replaces pinned
## install-spatial-deps@v0.2, which adds the ubuntugis PPA whose GDAL is
## ABI-incompatible with the binaries in Posit's noble cache.
##
## Nothing else needed carrying over: `any::covr` is added by the reusable
## workflow, and `dependencies` defaults to '"all"'.

name: test-coverage

on:
  push:
    ## Was [master, development]. `git ls-remote --heads` shows only `main` and
    ## `development`, so `master` was dead and coverage never ran on the default
    ## branch -- codecov only reports for a branch the workflow actually runs on.
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  ## Group by github.ref so a PR run and a branch-push run never share a group.
  ## Never cancel a push/merge run: covr is slow and merges land minutes apart,
  ## so cancelling one surfaces as spurious red.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-coverage:
    uses: PredictiveEcology/actions/.github/workflows/test-coverage.yaml@main
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
